name: Continuous Integration

on:
  push:
    branches: [ "deploy" ]
  pull_request:
    branches: [ "deploy" ]

jobs:
  validate-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [customer-service, seller-service, auth-service, api-gateway, frontend]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
        working-directory: ./${{ matrix.service }}

      - name: Check for Linting/Formatting
        run: npm run lint --if-present
        working-directory: ./${{ matrix.service }}

      - name: Verify Build
        run: npm run build --if-present
        working-directory: ./${{ matrix.service }}