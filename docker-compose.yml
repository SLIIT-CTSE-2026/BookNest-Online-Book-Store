services:

  auth-service:
    build: ./auth-service
    container_name: booknest-auth-service
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGO_URI: ${AUTH_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${EXTERNAL_AUTH_SERVICE_PORT:-5001}:5001"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    networks:
      - booknest-network

  customer-service:
    build: ./customer-service
    container_name: booknest-customer-service
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5002
      MONGO_URI: ${CUSTOMER_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "${EXTERNAL_CUSTOMER_SERVICE_PORT:-5002}:5002"
    volumes:
      - ./customer-service:/app
      - /app/node_modules
    depends_on:
      - auth-service
    networks:
      - booknest-network

  seller-service:
    build: ./seller-service
    container_name: booknest-seller-service
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5003
      MONGO_URI: ${SELLER_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "${EXTERNAL_SELLER_SERVICE_PORT:-5003}:5003"
    volumes:
      - ./seller-service:/app
      - /app/node_modules
    depends_on:
      - auth-service
    networks:
      - booknest-network

  api-gateway:
    build: ./api-gateway
    container_name: booknest-api-gateway
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      CUSTOMER_SERVICE_URL: http://customer-service:5002
      SELLER_SERVICE_URL: http://seller-service:5003
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${EXTERNAL_API_GATEWAY_PORT:-5000}:5000"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - customer-service
      - seller-service
    networks:
      - booknest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booknest-frontend
    restart: always
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:${EXTERNAL_API_GATEWAY_PORT:-5000}/api
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - booknest-network

networks:
  booknest-network:
    driver: bridge